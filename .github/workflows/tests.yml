name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mitokit:
    name: MitoKit
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version && swift --version
      - name: Run package tests
        run: swift test --package-path apps/macos/MitoKit --enable-code-coverage -Xswiftc -warnings-as-errors
