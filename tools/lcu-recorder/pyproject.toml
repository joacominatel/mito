[project]
name = "lcu-recorder"
version = "0.1.0"
description = "Records anonymized League Client (LCU) REST and WAMP traffic as Mito fixtures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets>=17.1",
]

[project.scripts]
lcu-recorder = "lcu_recorder.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
