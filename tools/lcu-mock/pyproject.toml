[project]
name = "lcu-mock"
version = "0.1.0"
description = "Serves recorded or synthetic League Client (LCU) scenarios on 127.0.0.1 for Mito development."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "cryptography>=50.0.2",
]

[project.scripts]
lcu-mock = "lcu_mock.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
